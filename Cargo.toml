[package]
name = "rust_3dgs_renderer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = { version = "28.0.0", features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }
wgpu-3dgs-viewer = "0.6.1"
wasm-bindgen = "0.2.118"
wasm-bindgen-futures = "0.4.68"
console_error_panic_hook = "0.1.7"
glam = { version = "0.30", features = ["bytemuck"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Window",
  "HtmlCanvasElement",
  "console",
]


